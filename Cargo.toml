[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tessera-client = { path = "crates/tessera-client" }
tessera-core = { path = "crates/tessera-core" }
tessera-widgets = { path = "crates/tessera-widgets" }

anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
csv = "=1.4.0"
directories = "=6.0.0"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
gpui-kit = "=0.9.0"
insta = "=1.49.0"
jiff = "=0.2.39"
keyring = "=4.2.0"
lsp-types = "=0.97.0"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset", "stream"] }
rust-i18n = "=4.2.4"
# Only for telling TLS failures apart; must stay the version reqwest uses.
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
secrecy = "=0.10.3"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sys-locale = "=0.3.2"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "macros", "sync", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["codec", "io"] }
toml = "=1.2.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
wiremock = "=0.6.5"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
strip = true
# NF5 (< 40 MB): without these the Linux binary is 48 MB. Fat LTO with one
# codegen unit cut the macOS binary by 20 % (22.8 → 18.2 MB).
lto = "fat"
codegen-units = 1
# The request log and dock pushed Linux to 43.0 MB. Without unwind tables macOS
# went from 21.4 to 17.7 MB. A panic already ended the app (GPUI main thread,
# tokio tasks re-panic in the connector); only tests catch unwinds, and they
# build with the test profile.
panic = "abort"
