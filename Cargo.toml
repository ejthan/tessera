[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tessera-client = { path = "crates/tessera-client" }
tessera-core = { path = "crates/tessera-core" }
tessera-widgets = { path = "crates/tessera-widgets" }

anyhow = "=1.0.104"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
csv = "=1.4.0"
directories = "=6.0.0"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
gpui-kit = "=0.9.0"
hmac = "=0.13.0"
insta = "=1.49.0"
jiff = "=0.2.39"
keyring = "=4.2.0"
lsp-types = "=0.97.0"
percent-encoding = "=2.3.2"
png = "=0.18.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset", "stream"] }
rust-i18n = "=4.2.4"
# Only for telling TLS failures apart; must stay the version reqwest uses.
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
secrecy = "=0.10.3"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = { version = "=0.11.1", default-features = false }
sys-locale = "=0.3.2"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "macros", "sync", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["codec", "io"] }
toml = "=1.2.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
wiremock = "=0.6.5"
zeroize = "=1.9.1"
zstd = { version = "=0.14.3", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
strip = true
# NF5 (< 40 MiB, 41,943,040 bytes): fat LTO with one codegen unit cut the macOS
# binary by 20 % (22.8 to 18.2 MB).
lto = "fat"
codegen-units = 1
# Without unwind tables macOS went from 21.4 to 17.7 MB. A panic already ended
# the app (GPUI main thread, tokio tasks re-panic in the connector); only tests
# catch unwinds, and they build with the test profile.
panic = "abort"

# NF5, D115: at opt-level 3 Linux was 52.7 MB on x86_64 and 45.3 MB on aarch64,
# nearly all of it .text, spread over tens of thousands of functions. See
# .cargo/config.toml for the linker half.
[profile.release.package]
# Everything not named here is off the hot paths.
"*" = { opt-level = "z" }
# Most code here is generics instantiated in this crate, so its level does the
# most. It also sets the level of the LTO pass over the whole binary, the render
# crates below included. Cargo drops `strip` to "debuginfo" for a package with
# an override unless the override repeats it.
tessera-app = { opt-level = "s", strip = true }
tessera-widgets = { opt-level = "s" }
gpui-base = { opt-level = "s" }
gpui-component = { opt-level = "s" }
# NF2: render, layout, text and GPU.
gpui-pre = { opt-level = 3 }
gpui-pre-collections = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-refineable = { opt-level = 3 }
gpui-pre-scheduler = { opt-level = 3 }
gpui-pre-shared-string = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-pre-util = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
gpui-pre-windows = { opt-level = 3 }
taffy = { opt-level = 3 }
ash = { opt-level = 3 }
gpu-allocator = { opt-level = 3 }
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
wgpu-types = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
font-types = { opt-level = 3 }
harfrust = { opt-level = 3 }
read-fonts = { opt-level = 3 }
skrifa = { opt-level = 3 }
swash = { opt-level = 3 }
zeno = { opt-level = 3 }
# NF3: network, TLS, JSON, CSV, zstd.
aws-lc-rs = { opt-level = 3 }
aws-lc-sys = { opt-level = 3 }
bytes = { opt-level = 3 }
csv = { opt-level = 3 }
csv-core = { opt-level = 3 }
futures-core = { opt-level = 3 }
futures-util = { opt-level = 3 }
h2 = { opt-level = 3 }
http = { opt-level = 3 }
http-body = { opt-level = 3 }
hyper = { opt-level = 3 }
hyper-rustls = { opt-level = 3 }
hyper-util = { opt-level = 3 }
memchr = { opt-level = 3 }
reqwest = { opt-level = 3 }
rustls = { opt-level = 3 }
rustls-webpki = { opt-level = 3 }
serde = { opt-level = 3 }
serde_core = { opt-level = 3 }
serde_json = { opt-level = 3 }
tokio = { opt-level = 3 }
tokio-rustls = { opt-level = 3 }
tokio-util = { opt-level = 3 }
zstd = { opt-level = 3 }
zstd-safe = { opt-level = 3 }
zstd-sys = { opt-level = 3 }
