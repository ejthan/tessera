name: Docs

on:
  push:
    branches: [main]
    paths: ["book/**"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo install mdbook --locked --version 0.5.4
      - run: mdbook build book
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/book
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
