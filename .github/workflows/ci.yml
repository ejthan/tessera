name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Packages GPUI needs on Ubuntu 24.04 (from the GPUI Kit 0.9 installation guide).
  LINUX_DEPS: >-
    gcc g++ clang libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev
    libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev
    vulkan-validationlayers libvulkan1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          # shellcheck disable=SC2086 # the package list is meant to split into words
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # the package list is meant to split into words
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --workspace --locked

  integration:
    strategy:
      fail-fast: false
      matrix:
        typesense: ["30.0", "30.2"]
    runs-on: ubuntu-24.04
    services:
      typesense:
        image: typesense/typesense:${{ matrix.typesense }}
        # Service containers cannot take arguments, so pass them as env.
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: xyz
          TYPESENSE_ENABLE_SEARCH_ANALYTICS: "true"
          TYPESENSE_ANALYTICS_DIR: /tmp/analytics
          TYPESENSE_ANALYTICS_MINUTE_RATE_LIMIT: "1000"
        ports:
          - 8108:8108
        # Lets the server reach the stub of a test on the runner.
        options: --add-host=host.docker.internal:host-gateway
      # live_operations snapshots and compacts, and refuses port 8108.
      typesense-ops:
        image: typesense/typesense:${{ matrix.typesense }}
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: xyz
        ports:
          - 18208:8108
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      # Keeps the seed sets valid against both Typesense versions.
      - run: cargo xtask seed --url http://localhost:8108 --key xyz
      - run: cargo test -p tessera-client --test live --locked -- --ignored
        env:
          TESSERA_IT_URL: http://localhost:8108
      - run: cargo test -p tessera-core --test live_ids --locked -- --ignored
        env:
          TESSERA_IT_URL: http://localhost:8108
          TESSERA_IT_KEY: xyz
      - run: cargo test -p tessera-client --test live_admin --locked -- --ignored
        env:
          TESSERA_IT_URL: http://localhost:8108
          TESSERA_IT_ANALYTICS: "1"
          TESSERA_IT_STUB_HOST: host.docker.internal
      - run: cargo test -p tessera-client --test live_ai --locked -- --ignored --skip live_builtin_model
        env:
          TESSERA_IT_URL: http://localhost:8108
          TESSERA_IT_STUB_HOST: host.docker.internal
      - run: cargo test -p tessera-client --test live_operations --locked -- --ignored
        env:
          TESSERA_IT_URL: http://localhost:18208
          TESSERA_IT_KEY: xyz
      - run: cargo test -p tessera-core --test live_scoped --test live_actions --locked -- --ignored
        env:
          TESSERA_IT_URL: http://localhost:8108
          TESSERA_IT_KEY: xyz
          TESSERA_IT_ANALYTICS: "1"
          TESSERA_IT_STUB_HOST: host.docker.internal

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2025
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2086 # the package list is meant to split into words
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --release --locked -p tessera-app
      - name: Check binary size (NF5, < 40 MB)
        shell: bash
        run: |
          bin=target/release/tessera
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "$bin: $size bytes"
          test "$size" -lt 41943040
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tessera-${{ matrix.name }}
          path: |
            target/release/tessera
            target/release/tessera.exe
          if-no-files-found: error
      - name: Smoke start
        shell: bash
        env:
          TESSERA_SMOKE: "1"
        run: |
          bin=target/release/tessera
          [ -f "$bin.exe" ] && bin="$bin.exe"
          run=(perl -e 'alarm 60; exec @ARGV' "$bin")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "${run[@]}"
          else
            "${run[@]}"
          fi
