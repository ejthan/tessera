name: Feature request
description: Something Tessera should do.
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: input
    id: typesense-version
    attributes:
      label: Typesense version
      description: If it depends on a server feature.
      placeholder: "30.2"
