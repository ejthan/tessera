[package]
name = "tessera-app"
description = "Tessera desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
frame-overlay = ["gpui-kit/profiler"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
rust-i18n.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
tessera-client.workspace = true
tessera-core.workspace = true
tessera-widgets.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
wiremock.workspace = true

[lints.clippy]
unwrap_used = "deny"
