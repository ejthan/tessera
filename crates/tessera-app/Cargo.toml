[package]
name = "tessera-app"
description = "Tessera desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Paths are relative to this crate: cargo-packager changes into it before reading them.
[package.metadata.packager]
product-name = "Tessera"
identifier = "org.tessera.Tessera"
description = "Native desktop client for Typesense."
homepage = "https://github.com/ejthan/tessera"
# The .deb writes this as its Maintainer line, which must not stay empty.
authors = ["Tessera contributors"]
category = "DeveloperTool"
before-packaging-command = "cargo build --release --locked -p tessera-app"
icons = [
    "../../assets/icons/app/tessera.icns",
    "../../assets/icons/app/tessera.ico",
    "../../assets/icons/app/*.png",
]
resources = ["../../LICENSE", "../../THIRD_PARTY_NOTICES.md"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
signing-identity = "-"

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0", "libxcb1", "libvulkan1"]

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
frame-overlay = ["gpui-kit/profiler"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
rust-i18n.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
tessera-client.workspace = true
tessera-core.workspace = true
tessera-widgets.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
wiremock.workspace = true

[lints.clippy]
unwrap_used = "deny"
